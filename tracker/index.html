<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Tracker | FAST AMINOS WELLNESS</title>
<meta name="description" content="Track body fat, lean mass, measurements and progress photos with your FAST AMINOS WELLNESS trainer.">
<meta name="theme-color" content="#1769E8">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FA Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="../" aria-label="FAST AMINOS WELLNESS home"><img src="../fast-aminos-wellness.svg" alt="FAST AMINOS WELLNESS"></a>
    <span class="brand-sub">Progress Tracker</span>
    <div class="bar-right" id="barRight"></div>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannerText"></div></div>
<main class="wrap" id="app"><div class="skel"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="dlgClient">
  <form id="fClient" novalidate>
    <h3 id="cTitle">New client</h3>
    <div class="field"><label for="c-name">Name</label><input id="c-name" type="text" autocomplete="off"></div>
    <div class="field"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="off" inputmode="email"><span class="hint">The client signs in with this email to see their progress.</span></div>
    <div class="grid2">
      <div class="field"><label for="c-sex">Sex (for formulas)</label><select id="c-sex"><option value="female">Female</option><option value="male">Male</option></select></div>
      <div class="field"><label for="c-dob">Date of birth</label><input id="c-dob" type="date"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="c-ft">Height, feet</label><input id="c-ft" type="number" inputmode="numeric" min="3" max="7" step="1"></div>
      <div class="field"><label for="c-in">Height, inches</label><input id="c-in" type="number" inputmode="decimal" min="0" max="11.5" step="0.5"></div>
    </div>
    <div class="field"><label for="c-goal">Goal (optional)</label><input id="c-goal" type="text" placeholder="e.g. Drop 10 lb of fat, keep lean mass"></div>
    <div class="err" id="cErr"></div>
    <div class="foot">
      <button type="button" class="btn danger" id="cDelete" hidden>Delete client</button>
      <div class="r"><button type="button" class="btn" id="cCancel">Cancel</button><button type="submit" class="btn primary" id="cSave">Save client</button></div>
    </div>
  </form>
</dialog>

<dialog id="dlgEntry">
  <form id="fEntry" novalidate>
    <h3 id="eTitle">New check-in</h3>
    <div class="tipbox" id="eTip"></div>
    <div class="grid2">
      <div class="field"><label for="e-date">Date</label><input id="e-date" type="date"></div>
      <div class="field"><label for="e-weight">Weight (lb)</label><input id="e-weight" type="number" inputmode="decimal" step="0.1" min="50" max="700"></div>
    </div>
    <div class="grid3">
      <div class="field"><label for="e-waist">Waist (in)</label><input id="e-waist" type="number" inputmode="decimal" step="0.1"><span class="hint">At the navel</span></div>
      <div class="field"><label for="e-neck">Neck (in)</label><input id="e-neck" type="number" inputmode="decimal" step="0.1"><span class="hint">Below the Adam's apple</span></div>
      <div class="field" id="hipField"><label for="e-hip">Hips (in)</label><input id="e-hip" type="number" inputmode="decimal" step="0.1"><span class="hint">Widest point</span></div>
    </div>
    <div class="box" id="omronBox">
      <span class="lbl">Gym day: Omron reading (optional)</span>
      <div class="field" style="max-width:220px"><label for="e-omron">Omron body fat %</label><input id="e-omron" type="number" inputmode="decimal" step="0.1" min="3" max="70"></div>
      <div class="tipbox" id="omronProfile"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="e-front">Front photo (optional)</label><input id="e-front" type="file" accept="image/*"></div>
      <div class="field"><label for="e-side">Side photo (optional)</label><input id="e-side" type="file" accept="image/*"></div>
    </div>
    <div class="field"><label for="e-note">Note (optional)</label><input id="e-note" type="text" maxlength="500" placeholder="e.g. Measured after a rest day"></div>
    <div class="live" id="eLive"></div>
    <div class="err" id="eErr"></div>
    <div class="foot"><div class="r"><button type="button" class="btn" id="eCancel">Cancel</button><button type="submit" class="btn primary" id="eSave">Save check-in</button></div></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
